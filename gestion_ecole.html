<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDU-RDC – Plateforme Intégrée de Gestion Scolaire Professionnelle</title>

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

<!-- Bootstrap Styles -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.view-section { display: none; }
.view-section.active { display: block; }
.school-card { cursor: pointer; transition: transform 0.2s; }
.school-card:hover { transform: translateY(-3px); }
body { background:#f3f4f6; font-family: 'Nunito', sans-serif; color:#1f2937; }
.sidebar-menu .list-group-item { font-weight: 600; font-size: 14px; border: 0; border-radius: 6px; margin-bottom: 4px; }
.sidebar-menu .list-group-item.active { background-color: #0d6efd; color: #fff; }
.logo-preview { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid #dee2e6; }
.params-submenu { padding-left: 10px; background-color: #f8f9fa; border-left: 3px solid #0d6efd; margin-top: 5px; display: none; }
.params-submenu.show { display: block; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* STYLES BULLETIN INTEGRE */
.bulletin-container *{box-sizing:border-box}
.bulletin-container .page{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:7mm 8mm;font-size:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);color:#000;font-family:Arial,Helvetica,sans-serif; page-break-inside: avoid; break-inside: avoid;}
.bulletin-container .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.bulletin-container .logo{width:64px;height:50px;display:flex;align-items:center;justify-content:center}
.bulletin-container .logo img,.bulletin-container .logo svg{max-width:100%;max-height:100%}
.bulletin-container .ht{text-align:center;font-weight:bold;font-size:11.5px;line-height:1.3;flex:1;padding:0 6px}
.bulletin-container .idn{display:inline-block;border:1px solid #000;padding:1px 4px;font-weight:bold;margin:2px 0}
.bulletin-container .idn input{width:160px}
.bulletin-container input{font:inherit;color:#000;border:0;background:transparent;outline:none;border-radius:0}
.bulletin-container input:disabled{cursor:not-allowed}
.bulletin-container table.ident{width:100%;border-collapse:collapse;border:1px solid #000;margin-bottom:2px}
.bulletin-container table.ident td{padding:2px 4px;font-size:8.5px;border:0;vertical-align:bottom;white-space:nowrap}
.bulletin-container table.ident input{border-bottom:1px dotted #000;width:62%}
.bulletin-container table.ident input.s{width:12%}
.bulletin-container table.ident input.d{width:30%}
.bulletin-container table.ident input.bx{width:70%;letter-spacing:5px;border:1px solid #000;padding:1px 3px}
.bulletin-container .title{text-align:center;font-weight:bold;font-size:8.5px;border:1px solid #000;padding:2px;margin-bottom:2px}
.bulletin-container .title input{width:2.2em;border-bottom:1px dotted #000;text-align:center;font-weight:bold}
.bulletin-container table.b{width:100%;border-collapse:collapse;table-layout:fixed}
.bulletin-container table.b td,.bulletin-container table.b th{border:1px solid #000;padding:0 1px;height:13.5px;text-align:center;font-size:8px;line-height:1.1;overflow:hidden}
.bulletin-container table.b th{font-weight:bold}
.bulletin-container table.b td.nm{text-align:left;padding-left:3px;position:relative}
.bulletin-container table.b tr.dom td{font-weight:bold;font-size:8.5px;position:relative}
.bulletin-container table.b tr.sdom td{font-weight:bold;font-size:8px;position:relative}
.bulletin-container table.b tr.sub td{font-weight:bold}
.bulletin-container table.b tr.bold td{font-weight:bold}
.bulletin-container table.b td.blk{background:#000}
.bulletin-container table.b td.gry{background:#d1d5db}
.bulletin-container table.b td.tt{position:relative;font-weight:bold}
.bulletin-container table.b td.tt i{position:absolute;left:1px;top:0;font-size:6px;color:#444;font-style:normal;font-weight:normal}
.bulletin-container table.b td input{width:100%;border:0;text-align:center;padding:0;height:12px}
.bulletin-container td.side{vertical-align:top;text-align:left !important;padding:3px 4px !important;font-size:8px;line-height:1.6}
.bulletin-container td.side .sc{text-align:center;margin-top:10px}
.bulletin-container .strk.on{text-decoration:line-through}
.bulletin-container .foot{margin-top:3px;font-size:8.5px;line-height:1.7}
.bulletin-container .foot .box{border:1px solid #000;padding:2px 4px}
.bulletin-container .foot input.long{width:38%;border-bottom:1px dotted #000}
.bulletin-container .foot .row{display:flex;justify-content:space-between}
.bulletin-container .foot .c{text-align:center}
.bulletin-container .foot .r{text-align:right}
.bulletin-container .note{font-size:8px;margin-top:3px}
.bulletin-container .note .code{float:right}
.bulletin-container .dots{display:inline-block;min-width:60px;border-bottom:1px dotted #000}

@media print{
 @page{size:A4 portrait;margin:5mm}
 body{background:#fff; padding:0; margin:0;}
 .no-print,.navbar,.sidebar-menu,.dashboard-section,.nav-tabs,.modal-header,.modal-footer,.boutons,.p-3,.btn{display:none !important}
 .wrap{overflow:visible;padding:0}
 .bulletin-container .page{box-shadow:none;margin:0 auto;width:100%;padding:0; page-break-inside: avoid; break-inside: avoid;}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body > *:not(.modal) { display: none !important; }
 .modal { position: absolute !important; left: 0 !important; top: 0 !important; margin: 0 !important; padding: 0 !important; display: block !important; overflow: visible !important; z-index: 9999 !important; background: #fff !important; width: 100% !important; }
 .modal-dialog { max-width: 100% !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
 .modal-content { border: 0 !important; box-shadow: none !important; background: transparent !important; }
 .modal-body { padding: 0 !important; margin: 0 !important; }
 .carte { page-break-inside: avoid; break-inside: avoid; margin: 0 auto 10px !important; }
}

.border-top-4 { border-top-width: 4px !important; }
.border-indigo { border-color: #6610f2 !important; }
.text-indigo { color: #6610f2 !important; }
.bg-indigo { background-color: #6610f2 !important; }

.dash-btn {
    width: 100%;
    padding: 10px 6px;
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    color: #343a40;
    transition: all 0.2s ease-in-out;
}
.dash-btn i { font-size: 18px; }
.dash-btn:hover {
    background-color: #6610f2;
    color: #ffffff !important;
    border-color: #6610f2;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(102, 16, 242, 0.2);
}
.dash-btn:hover i { color: #ffffff !important; }
</style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white navbar-light shadow-sm sticky-top p-0 no-print">
        <a href="#" class="navbar-brand d-flex align-items-center px-4 px-lg-5" onclick="showSection('view-portal')">
            <h2 class="m-0 text-primary"><i class="fa fa-school me-3"></i>EDU-RDC</h2>
        </a>
        <div class="ms-auto p-3 d-flex align-items-center gap-2 flex-wrap">
            <button class="btn btn-outline-danger btn-sm fw-bold" onclick="openAdminCentralPanel()"><i class="fa fa-user-shield me-1"></i> Admin Central</button>
            <button class="btn btn-outline-primary btn-sm fw-bold" onclick="showSection('view-portal')"><i class="fa fa-home me-1"></i> Accueil Portail</button>
        </div>
    </nav>

    <div class="container-fluid py-4 px-lg-5">

        <!-- PORTAIL PRINCIPAL -->
        <div id="view-portal" class="view-section active">
            <div class="text-center mb-4">
                <h2 class="text-primary fw-bold">Plateforme de Gestion Scolaire EDU-RDC</h2>
                <p class="text-muted">Sélectionnez un service ci-dessous :</p>
            </div>

            <!-- BARRE DE RECHERCHE DYNAMIQUE DE L'ÉCOLE -->
            <div class="card shadow-sm border-0 p-3 mb-4 bg-white">
                <div class="row align-items-center">
                    <div class="col-md-6 mb-2 mb-md-0">
                        <h4 class="m-0 text-primary fw-bold"><i class="fa fa-list me-2"></i>Liste des Écoles Enregistrées</h4>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white"><i class="fa fa-search"></i></span>
                            <input type="text" id="searchSchoolInput" class="form-control" placeholder="Rechercher une école par son Nom..." oninput="filterSchoolsList()">
                            <button class="btn btn-primary fw-bold" onclick="openSchoolForm()"><i class="fa fa-plus-circle me-1"></i> Créer École</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="schoolsListContainer" class="row g-3"></div>
        </div>

        <!-- FORMULAIRE CRÉATION ÉCOLE -->
        <div id="view-create-school" class="view-section">
            <button class="btn btn-secondary btn-sm mb-3" onclick="showSection('view-portal')"><i class="fa fa-arrow-left me-1"></i> Retour au Portail</button>
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="m-0 text-white" id="schoolFormTitle"><i class="fa fa-plus-circle me-2"></i>Créer / Configurer une École</h4>
                </div>
                <div class="card-body p-4">
                    <form id="formCreateSchool" onsubmit="handleSaveSchool(event)">
                        <input type="hidden" id="editSchoolId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nom Officiel de l'École :</label>
                                <input type="text" id="schoolName" class="form-control" placeholder="Ex: C.S. LA REVOLUTION" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Appartenance / Régime :</label>
                                <select id="schoolAppartenance" class="form-select" required>
                                    <option value="Non Conventionnée (Privée)">Non Conventionnée (Privée / Laïque)</option>
                                    <option value="Conventionnée Catholique">Conventionnée Catholique</option>
                                    <option value="Conventionnée Protestante">Conventionnée Protestante</option>
                                    <option value="Conventionnée Kimbanguiste">Conventionnée Kimbanguiste</option>
                                    <option value="Conventionnée Islamique">Conventionnée Islamique</option>
                                    <option value="Officielle / Publique">Officielle / Publique</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Province Éducationnelle :</label>
                                <input type="text" id="schoolProvince" class="form-control" placeholder="Ex: KINSHASA-LUKUNGA" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">District / Territoire :</label>
                                <input type="text" id="schoolDistrict" class="form-control" placeholder="Ex: LUKUNGA" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Commune :</label>
                                <input type="text" id="schoolCommune" class="form-control" placeholder="Ex: KALAMU" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Adresse Physique Complète :</label>
                                <input type="text" id="schoolAdresse" class="form-control" placeholder="Ex: N° 12, Av. des Écoles, Q/ Matonge">
                            </div>
                            <div class="col-12 mt-4 d-flex gap-2">
                                <button type="submit" id="btnSaveSchool" class="btn btn-success fw-bold px-4"><i class="fa fa-save me-1"></i> Enregistrer l'École</button>
                                <button type="button" class="btn btn-secondary fw-bold" onclick="showSection('view-portal')">Annuler</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script>
        const STORAGE_KEYS = ["EDURDC_FULL_PLATFORM_V12", "EDURDC_FULL_PLATFORM_V11", "EDURDC_FULL_PLATFORM_V10", "EDURDC_SCHOOLS_DATA"];
        let appData = { schools: [] };

        window.onload = function() {
            loadAllStoredSchools();
            renderSchoolsList();
        };

        function loadAllStoredSchools() {
            let combinedSchools = [];
            STORAGE_KEYS.forEach(key => {
                let item = localStorage.getItem(key);
                if (item) {
                    try {
                        let parsed = JSON.parse(item);
                        let schoolsList = Array.isArray(parsed) ? parsed : (parsed.schools || []);
                        schoolsList.forEach(school => {
                            if (!combinedSchools.some(s => s.id === school.id || s.name.toLowerCase() === school.name.toLowerCase())) {
                                combinedSchools.push(school);
                            }
                        });
                    } catch(e) { console.error("Erreur de lecture sur ", key); }
                }
            });
            appData.schools = combinedSchools;
            saveData();
        }

        function saveData() { 
            localStorage.setItem("EDURDC_FULL_PLATFORM_V12", JSON.stringify(appData)); 
        }

        function generateSecretCode() {
            return 'SEC-' + Math.floor(1000 + Math.random() * 9000);
        }

        function showSection(id) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'view-portal') {
                renderSchoolsList();
            }
        }

        function filterSchoolsList() {
            const query = document.getElementById('searchSchoolInput').value.toLowerCase().trim();
            renderSchoolsList(query);
        }

        function renderSchoolsList(filterQuery = '') {
            const container = document.getElementById('schoolsListContainer');
            if (!container) return;
            container.innerHTML = "";
            
            if (!appData.schools || appData.schools.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-warning text-center p-4">
                            <h5><i class="fa fa-exclamation-circle me-2"></i>Aucune école enregistrée pour le moment.</h5>
                            <p class="m-0">Cliquez sur le bouton <b>« Créer École »</b> ci-dessus pour enregistrer votre premier établissement.</p>
                        </div>
                    </div>`;
                return;
            }

            const list = appData.schools.filter(s => s.name.toLowerCase().includes(filterQuery));

            if (list.length === 0) {
                container.innerHTML = `<div class="col-12"><div class="alert alert-info text-center">Aucune école ne correspond à la recherche : <b>"${filterQuery}"</b></div></div>`;
                return;
            }

            list.forEach(s => {
                container.innerHTML += `
                    <div class="col-md-6">
                        <div class="card shadow-sm border-start border-4 border-primary p-3">
                            <div class="d-flex align-items-center gap-3">
                                <i class="fa fa-school fa-2x text-primary"></i>
                                <div class="flex-grow-1">
                                    <h5 class="m-0 fw-bold text-primary">${s.name}</h5>
                                    <small class="text-muted d-block">${s.appartenance || 'Régime non précisé'} — ${s.province || ''} / ${s.commune || ''}</small>
                                    <small class="text-dark fw-bold">Code Secret : <span class="badge bg-dark">${s.secretCode || 'N/A'}</span></small>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openSchoolForm() {
            document.getElementById('formCreateSchool').reset();
            document.getElementById('editSchoolId').value = "";
            showSection('view-create-school');
        }

        function handleSaveSchool(e) {
            e.preventDefault();
            const name = document.getElementById('schoolName').value.trim();
            const appartenance = document.getElementById('schoolAppartenance').value;
            const province = document.getElementById('schoolProvince').value.trim();
            const district = document.getElementById('schoolDistrict').value.trim();
            const commune = document.getElementById('schoolCommune').value.trim();
            const adresse = document.getElementById('schoolAdresse').value.trim();
            const secretCode = generateSecretCode();

            const newSchool = {
                id: 'SCH-' + Date.now(),
                name: name,
                appartenance: appartenance,
                province: province,
                district: district,
                commune: commune,
                adresse: adresse,
                secretCode: secretCode,
                students: [],
                teachers: [],
                staff: []
            };

            appData.schools.push(newSchool);
            saveData();
            alert(`École "${name}" enregistrée avec succès !\n\nCODE SECRET PROPRIÉTAIRE : ${secretCode}`);
            showSection('view-portal');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
