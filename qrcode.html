<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>EDU-RDC - Cartes QR & Identifications</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK (Compat) pour une parfaite synchronisation globale -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <style>
        .id-card {
            width: 8.5cm;
            height: 5.5cm;
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%) !important;
            border-radius: 8px;
            color: #ffffff !important;
            padding: 8px 10px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin: 0 auto;
            font-family: Arial, sans-serif;
            overflow: hidden;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
        }
        .card-photo {
            width: 1.4cm;
            height: 1.7cm;
            object-fit: cover;
            border: 1.5px solid #ffffff;
            border-radius: 4px;
            background-color: #ffffff;
            cursor: pointer;
        }
        .card-details { font-size: 0.35rem; line-height: 1.2; margin-left: 4px; color: #fff; }
        .qr-container {
            position: absolute;
            bottom: 10px;
            right: 8px;
            background: #ffffff;
            padding: 2px;
            border-radius: 3px;
            width: 1.05cm;
            height: 1.05cm;
        }
        .qr-container img { width: 100%; height: 100%; object-fit: contain; }
        @media print {
            body * { visibility: hidden; }
            #cardPreviewContainer, #cardPreviewContainer * { visibility: visible; }
            #cardPreviewContainer { position: absolute; left: 0; top: 0; margin: 0; }
        }
    </style>
</head>
<body style="background-color: #f8f9fa; padding: 10px;">

    <!-- Écran Accès École -->
    <div class="container" id="authSection" style="max-width: 500px; margin-top: 40px;">
        <div class="card shadow p-4 bg-white rounded border-0">
            <h3 class="text-center text-primary mb-4"><i class="fa fa-school me-2"></i>Accès Établissement</h3>
            <div class="mb-3">
                <label class="form-label fw-bold">Nom Complet ou Code de l'École</label>
                <input type="text" id="authSchoolName" class="form-control" placeholder="ex: C.S. LA RÉVOLUTION ou Code">
            </div>
            <button type="button" onclick="ouvrirEspace()" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="fa fa-key me-2"></i>Ouvrir l'Espace École
            </button>
            <div class="mt-3 text-center">
                <a href="gestion_ecole.html" class="text-muted small"><i class="fa fa-arrow-left me-1"></i> Retour à la plateforme principale</a>
            </div>
        </div>
    </div>

    <!-- Espace de Génération -->
    <div class="container" id="cardGeneratorSection" style="display: none; margin-top: 10px; max-width: 950px;">
        <div class="alert alert-success d-flex justify-content-between align-items-center mb-3">
            <span><i class="fa fa-shield-alt me-2"></i>École Active : <strong id="lockedSchoolTitle">---</strong></span>
            <div>
                <a href="gestion_ecole.html" class="btn btn-sm btn-primary me-1"><i class="fa fa-home"></i> Accueil</a>
                <button class="btn btn-sm btn-danger" onclick="location.reload()"><i class="fa fa-sign-out-alt"></i> Changer</button>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="bg-white p-3 rounded shadow-sm border">
                    <h5 class="text-primary mb-3">Formulaire Carte & QR</h5>
                    <div class="mb-2">
                        <label class="form-label small fw-bold mb-1">Nom :</label>
                        <input type="text" class="form-control form-control-sm mb-2" id="inputNom" placeholder="Nom" value="KALOMBO" oninput="mettreAJour()">
                        <label class="form-label small fw-bold mb-1">Prénom :</label>
                        <input type="text" class="form-control form-control-sm mb-2" id="inputPrenom" placeholder="Prénom" value="Mike" oninput="mettreAJour()">
                        <label class="form-label small fw-bold mb-1">Matricule :</label>
                        <input type="text" class="form-control form-control-sm mb-2" id="inputMatricule" placeholder="Matricule" value="MAT-001" oninput="mettreAJour()">
                        <label class="form-label small fw-bold mb-1">Photo (Fichier) :</label>
                        <input type="file" class="form-control form-control-sm mb-2" id="inputPhotoFile" accept="image/*" onchange="chargerPhoto(event)">
                    </div>
                    <button type="button" onclick="enregistrerSurFirebase()" class="btn btn-outline-primary w-100 py-2 fw-bold">
                        <i class="fa fa-cloud-upload-alt me-2"></i>Enregistrer dans l'École Active
                    </button>
                </div>
            </div>

            <div class="col-lg-6 text-center">
                <div id="cardPreviewContainer">
                    <div class="id-card" id="cardPreview">
                        <div class="fw-bold small text-center border-bottom pb-1 mb-1">RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</div>
                        <div class="d-flex align-items-start mt-1">
                            <img id="cardUserPhoto" src="img/team-1.jpg" class="card-photo" alt="Photo">
                            <div class="card-details text-start">
                                <div><strong>Nom :</strong> <span id="viewNom">KALOMBO</span></div>
                                <div><strong>Prénom :</strong> <span id="viewPrenom">Mike</span></div>
                                <div><strong>Matricule :</strong> <span id="viewMatricule">MAT-001</span></div>
                            </div>
                        </div>
                        <div class="qr-container" id="qrcodePreview"></div>
                    </div>
                </div>
                <button onclick="window.print()" class="btn btn-success mt-3 py-2 px-4 fw-bold"><i class="fa fa-print me-1"></i> Imprimer la Carte</button>
            </div>
        </div>
    </div>

    <!-- Script de Gestion Intégré Compatible Firestore Global -->
    <script>
        let db = null;
        let appData = { schools: [] };
        let currentSchoolId = null;
        let currentSchoolName = "";
        let base64Photo = "";

        window.onload = function() {
            try {
                if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                    db = firebase.firestore();
                    db.collection("edu_rdc_data").doc("global_state").onSnapshot((doc) => {
                        if (doc.exists) {
                            appData = doc.data();
                        }
                    });
                } else {
                    let saved = localStorage.getItem("EDURDC_FULL_PLATFORM_V10");
                    if (saved) appData = JSON.parse(saved);
                }
            } catch(e) {
                let saved = localStorage.getItem("EDURDC_FULL_PLATFORM_V10");
                if (saved) appData = JSON.parse(saved);
            }
        };

        window.ouvrirEspace = function() {
            const saisie = document.getElementById('authSchoolName').value.trim().toUpperCase();
            if(!saisie) { alert("Saisissez le nom ou le code de l'école !"); return; }
            
            if(!appData.schools) appData.schools = [];
            
            // Recherche par nom ou par code secret
            let ecole Trouvee = appData.schools.find(s => s.name.toUpperCase() === saisie || s.secretCode.toUpperCase() === saisie || s.id.toUpperCase() === saisie);
            
            if (!ecoleTrouvee) {
                // Si l'école n'existe pas encore dans le répertoire global, on la crée automatiquement pour fluidifier l'expérience
                ecoleTrouvee = {
                    id: 'SCH-' + Date.now(),
                    name: saisie,
                    appartenance: 'Non Conventionnée (Privée)',
                    province: 'KINSHASA',
                    district: 'KINTAMBO',
                    commune: 'KINSHASA',
                    secretCode: 'SEC-' + Math.floor(1000 + Math.random() * 9000),
                    students: [],
                    staff: [],
                    teachers: [],
                    caisse: [],
                    studentPayments: []
                };
                appData.schools.push(ecoleTrouvee);
                sauvegarderGlobal();
            }

            currentSchoolId = ecoleTrouvee.id;
            currentSchoolName = ecoleTrouvee.name;

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('cardGeneratorSection').style.display = 'block';
            document.getElementById('lockedSchoolTitle').innerText = currentSchoolName;
            window.mettreAJour();
        };

        window.chargerPhoto = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Photo = e.target.result;
                document.getElementById('cardUserPhoto').src = base64Photo;
            };
            reader.readAsDataURL(file);
        };

        window.mettreAJour = function() {
            const nom = document.getElementById('inputNom').value || '---';
            const prenom = document.getElementById('inputPrenom').value || '---';
            const mat = document.getElementById('inputMatricule').value || '---';

            document.getElementById('viewNom').innerText = nom;
            document.getElementById('viewPrenom').innerText = prenom;
            document.getElementById('viewMatricule').innerText = mat;

            const qrText = "EDU-RDC:" + currentSchoolName + ":" + mat + ":" + nom + " " + prenom;
            document.getElementById('qrcodePreview').innerHTML = '<img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=' + encodeURIComponent(qrText) + '">';
        };

        window.enregistrerSurFirebase = async function() {
            const nom = document.getElementById('inputNom').value.trim();
            const prenom = document.getElementById('inputPrenom').value.trim();
            const mat = document.getElementById('inputMatricule').value.trim();

            if(!nom || !mat) {
                alert("Veuillez remplir au moins le nom et le matricule !");
                return;
            }

            const ecole = appData.schools.find(s => s.id === currentSchoolId);
            if (ecole) {
                if(!ecole.students) ecole.students = [];
                // Vérifier si l'élève existe déjà pour le mettre à jour ou l'ajouter
                let existing = ecole.students.find(st => st.mat === mat);
                if (existing) {
                    existing.name = nom + " " + prenom;
                    existing.sexe = "M";
                    if(base64Photo) existing.photo = base64Photo;
                } else {
                    ecole.students.push({
                        id: 'STU-' + Date.now(),
                        mat: mat,
                        name: nom + " " + prenom,
                        sexe: "M",
                        classe: "Générale",
                        photo: base64Photo || "",
                        cardData: { nom, prenom, matricule: mat }
                    });
                }
                await sauvegarderGlobal();
                alert("Carte enregistrée avec succès dans l'école " + currentSchoolName + " et synchronisée avec la base globale !");
            } else {
                alert("Erreur : École active introuvable.");
            }
        };

        async function sauvegarderGlobal() {
            localStorage.setItem("EDURDC_FULL_PLATFORM_V10", JSON.stringify(appData));
            if (db) {
                try {
                    await db.collection("edu_rdc_data").doc("global_state").set(appData);
                } catch (e) {
                    console.error("Erreur de synchronisation Firestore :", e);
                }
            }
        }
    </script>
</body>
</html>
