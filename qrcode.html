<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>EDU-RDC - Générateur de Cartes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .id-card {
            width: 8.5cm;
            height: 5.5cm;
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%) !important;
            border-radius: 8px;
            color: #ffffff !important;
            padding: 8px 10px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin: 0 auto;
            font-family: Arial, sans-serif;
            overflow: hidden;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
        }
        .id-card header {
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.4);
            padding-bottom: 2px;
            margin-bottom: 4px;
        }
        .card-photo {
            width: 1.4cm;
            height: 1.7cm;
            object-fit: cover;
            border: 1.5px solid #ffffff;
            border-radius: 4px;
            background-color: #ffffff;
        }
        .qr-container {
            position: absolute;
            bottom: 10px;
            right: 8px;
            background: #ffffff;
            padding: 2px;
            border-radius: 3px;
            width: 1.05cm;
            height: 1.05cm;
        }
        .qr-container img { width: 100%; height: 100%; }
    </style>
</head>
<body style="background-color: #f8f9fa; padding: 20px;">

    <div class="container" id="authSection" style="max-width: 500px; margin-top: 50px;">
        <div class="card shadow p-4 bg-white rounded">
            <h3 class="text-center text-primary mb-4">Accès Établissement</h3>
            <div class="mb-3">
                <label class="form-label fw-bold">Nom de l'École</label>
                <input type="text" id="authSchoolName" class="form-control" placeholder="ex: C.S. LA RÉVOLUTION">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Code Secret</label>
                <input type="password" id="authOwnerCode" class="form-control" placeholder="••••••••">
            </div>
            <button type="button" onclick="ouvrirEspace()" class="btn btn-primary w-100 py-2 fw-bold">Accéder</button>
        </div>
    </div>

    <div class="container" id="cardGeneratorSection" style="display: none; margin-top: 20px;">
        <div class="alert alert-success d-flex justify-content-between align-items-center">
            <span>École connectée : <strong id="lockedSchoolTitle">---</strong></span>
            <button class="btn btn-sm btn-danger" onclick="location.reload()">Quitter</button>
        </div>

        <div class="card p-4 bg-white shadow">
            <h4 class="text-primary mb-3">Création de Carte</h4>
            <div class="mb-3">
                <label class="form-label">Nom du Bénéficiaire</label>
                <input type="text" id="inputNom" class="form-control" value="KALOMBO" oninput="mettreAJour()">
            </div>
            <div class="mb-3">
                <label class="form-label">Matricule</label>
                <input type="text" id="inputMatricule" class="form-control" value="001" oninput="mettreAJour()">
            </div>

            <div class="text-center mt-4">
                <div class="id-card" id="cardPreview">
                    <header>
                        <div style="font-size: 10px; font-weight: bold;">RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</div>
                        <div style="font-size: 9px;">MINISTÈRE DE L'ÉDUCATION NATIONALE</div>
                        <div id="cardSchoolName" style="font-size: 11px; font-weight: bold; margin-top: 2px;">NOM DE L'ÉCOLE</div>
                    </header>
                    <div class="d-flex align-items-start mt-1">
                        <img id="cardUserPhoto" src="img/team-1.jpg" class="card-photo" alt="Photo">
                        <div style="font-size: 10px; margin-left: 8px; text-align: left; color: white;">
                            <div><strong>Nom :</strong> <span id="viewNom">KALOMBO</span></div>
                            <div><strong>Matricule :</strong> <span id="viewMatricule">001</span></div>
                        </div>
                    </div>
                    <div class="qr-container" id="qrcodePreview"></div>
                </div>
                <button onclick="window.print()" class="btn btn-success mt-3">Imprimer la Carte</button>
            </div>
        </div>
    </div>

    <script>
        function ouvrirEspace() {
            var nomEcole = document.getElementById('authSchoolName').value.trim();
            if (!nomEcole) {
                alert("Veuillez entrer le nom de l'école !");
                return;
            }

            // Masquer l'authentification et afficher la génération instantanément
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('cardGeneratorSection').style.display = 'block';

            document.getElementById('lockedSchoolTitle').innerText = nomEcole.toUpperCase();
            document.getElementById('cardSchoolName').innerText = nomEcole.toUpperCase();
            mettreAJour();
        }

        function mettreAJour() {
            var nom = document.getElementById('inputNom').value || '---';
            var mat = document.getElementById('inputMatricule').value || '---';

            document.getElementById('viewNom').innerText = nom;
            document.getElementById('viewMatricule').innerText = mat;

            var qrDiv = document.getElementById('qrcodePreview');
            qrDiv.innerHTML = '<img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=' + encodeURIComponent(nom + '-' + mat) + '" alt="QR">';
        }
    </script>
</body>
</html>
