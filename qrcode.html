<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>EDU-RDC - Cartes QR & Identifications</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .id-card {
            width: 8.5cm;
            height: 5.5cm;
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%) !important;
            border-radius: 8px;
            color: #ffffff !important;
            padding: 8px 10px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin: 0 auto;
            font-family: Arial, sans-serif;
            overflow: hidden;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
        }
        .card-photo {
            width: 1.4cm;
            height: 1.7cm;
            object-fit: cover;
            border: 1.5px solid #ffffff;
            border-radius: 4px;
            background-color: #ffffff;
        }
        .card-details { font-size: 0.35rem; line-height: 1.2; margin-left: 4px; color: #fff; }
        .qr-container {
            position: absolute;
            bottom: 10px;
            right: 8px;
            background: #ffffff;
            padding: 2px;
            border-radius: 3px;
            width: 1.05cm;
            height: 1.05cm;
        }
        .qr-container img { width: 100%; height: 100%; object-fit: contain; }
        @media print {
            body * { visibility: hidden; }
            #cardPreviewContainer, #cardPreviewContainer * { visibility: visible; }
            #cardPreviewContainer { position: absolute; left: 0; top: 0; margin: 0; }
        }
    </style>
</head>
<body style="background-color: #f8f9fa; padding: 10px;">

    <!-- Écran Accès École -->
    <div class="container" id="authSection" style="max-width: 500px; margin-top: 40px;">
        <div class="card shadow p-4 bg-white rounded border-0">
            <h3 class="text-center text-primary mb-4"><i class="fa fa-school me-2"></i>Accès Établissement</h3>
            <div class="mb-3">
                <label class="form-label fw-bold">Nom Complet de l'École</label>
                <input type="text" id="authSchoolName" class="form-control" placeholder="ex: C.S. LA RÉVOLUTION">
            </div>
            <button type="button" onclick="ouvrirEspace()" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="fa fa-key me-2"></i>Ouvrir l'Espace École
            </button>
        </div>
    </div>

    <!-- Espace de Génération -->
    <div class="container" id="cardGeneratorSection" style="display: none; margin-top: 10px; max-width: 950px;">
        <div class="alert alert-success d-flex justify-content-between align-items-center mb-3">
            <span><i class="fa fa-shield-alt me-2"></i>École Active : <strong id="lockedSchoolTitle">---</strong></span>
            <button class="btn btn-sm btn-danger" onclick="location.reload()"><i class="fa fa-sign-out-alt"></i> Changer</button>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="bg-white p-3 rounded shadow-sm border">
                    <h5 class="text-primary mb-3">Formulaire Carte</h5>
                    <div class="mb-2">
                        <input type="text" class="form-control form-control-sm mb-2" id="inputNom" placeholder="Nom" value="KALOMBO" oninput="mettreAJour()">
                        <input type="text" class="form-control form-control-sm mb-2" id="inputPrenom" placeholder="Prénom" value="Mike" oninput="mettreAJour()">
                        <input type="text" class="form-control form-control-sm mb-2" id="inputMatricule" placeholder="Matricule" value="MAT-001" oninput="mettreAJour()">
                    </div>
                    <button type="button" onclick="enregistrerSurFirebase()" class="btn btn-outline-primary w-100 py-2 fw-bold">
                        <i class="fa fa-cloud-upload-alt me-2"></i>Enregistrer sur Firebase
                    </button>
                </div>
            </div>

            <div class="col-lg-6 text-center">
                <div id="cardPreviewContainer">
                    <div class="id-card" id="cardPreview">
                        <div class="fw-bold small text-center border-bottom pb-1 mb-1">RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</div>
                        <div class="d-flex align-items-start mt-1">
                            <img id="cardUserPhoto" src="img/team-1.jpg" class="card-photo" alt="Photo">
                            <div class="card-details text-start">
                                <div><strong>Nom :</strong> <span id="viewNom">KALOMBO</span></div>
                                <div><strong>Prénom :</strong> <span id="viewPrenom">Mike</span></div>
                                <div><strong>Matricule :</strong> <span id="viewMatricule">MAT-001</span></div>
                            </div>
                        </div>
                        <div class="qr-container" id="qrcodePreview"></div>
                    </div>
                </div>
                <button onclick="window.print()" class="btn btn-success mt-3 py-2 px-4 fw-bold">Imprimer la Carte</button>
            </div>
        </div>
    </div>

    <!-- Script Firebase Modulaire Exposé sur Window -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8PVf2sKt-n_8ANjUr7Iiv1PQkGJrjB-E",
            authDomain: "edu-rdc.firebaseapp.com",
            projectId: "edu-rdc",
            storageBucket: "edu-rdc.firebasestorage.app",
            messagingSenderId: "567182543451",
            appId: "1:567182543451:web:0d08c9303bfb18e4200d7e",
            measurementId: "G-3ELD77JK5N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentSchool = "";

        window.ouvrirEspace = function() {
            const nom = document.getElementById('authSchoolName').value.trim();
            if(!nom) return alert("Saisissez le nom de l'école !");
            currentSchool = nom.toUpperCase();
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('cardGeneratorSection').style.display = 'block';
            document.getElementById('lockedSchoolTitle').innerText = currentSchool;
            window.mettreAJour();
        };

        window.mettreAJour = function() {
            const nom = document.getElementById('inputNom').value || '---';
            const prenom = document.getElementById('inputPrenom').value || '---';
            const mat = document.getElementById('inputMatricule').value || '---';

            document.getElementById('viewNom').innerText = nom;
            document.getElementById('viewPrenom').innerText = prenom;
            document.getElementById('viewMatricule').innerText = mat;

            const qrText = "EDU-RDC:" + currentSchool + ":" + mat;
            document.getElementById('qrcodePreview').innerHTML = '<img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=' + encodeURIComponent(qrText) + '">';
        };

        window.enregistrerSurFirebase = async function() {
            try {
                await addDoc(collection(db, "cartes_ecoles"), {
                    school: currentSchool,
                    nom: document.getElementById('inputNom').value,
                    prenom: document.getElementById('inputPrenom').value,
                    matricule: document.getElementById('inputMatricule').value,
                    timestamp: serverTimestamp()
                });
                alert("Carte sauvegardée dans Firebase !");
            } catch(e) {
                alert("Erreur de sauvegarde : " + e.message);
            }
        };
    </script>
</body>
</html>
