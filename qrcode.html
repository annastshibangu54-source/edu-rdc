    <!-- Script Module Globale Corrigé -->
    <script type="module">
        import { db, collection, addDoc, getDocs, query, where, deleteDoc, doc } from './js/firebase-config.js?v=2026';

        let currentSchoolData = null;
        let tempPhotoBase64 = "img/team-1.jpg";

        function renderQRCodeInContainer(container, textData) {
            if (!container) return;
            container.innerHTML = "";
            let safeUrl = encodeURIComponent(textData);
            let img = document.createElement("img");
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${safeUrl}`;
            img.alt = "QR Code";
            container.appendChild(img);
        }

        window.handleLogin = function() {
            const inputName = document.getElementById('authSchoolName').value.trim();
            const inputCode = document.getElementById('authOwnerCode').value.trim();

            if (!inputName) {
                alert("Veuillez entrer le nom de l'école.");
                return;
            }

            currentSchoolData = {
                name: inputName.toUpperCase(),
                code: inputCode,
                province: "KINSHASA",
                logo: "img/course-1.jpg"
            };

            // Basculement visuel immédiat
            document.getElementById('authSection').classList.add('d-none');
            document.getElementById('cardGeneratorSection').classList.remove('d-none');
            document.getElementById('lockedSchoolTitle').innerText = currentSchoolData.name;
            document.getElementById('cardSchoolName').innerText = currentSchoolData.name;

            document.getElementById('inputProvince').value = "KINSHASA";
            window.previewCardUpdate();
            window.loadSavedCardsVault();
        };

        window.previewCardUpdate = function() {
            if (!currentSchoolData) return;
            const category = document.getElementById('cardCategory').value;
            const nom = document.getElementById('inputNom').value || '---';
            const postnom = document.getElementById('inputPostnom').value || '---';
            const prenom = document.getElementById('inputPrenom').value || '---';
            const matricule = document.getElementById('inputMatricule').value || '---';
            const province = document.getElementById('inputProvince').value || 'KINSHASA';
            const adresse = document.getElementById('inputAdresse').value || '---';

            document.getElementById('cardRoleBadge').innerText = category.toUpperCase();
            document.getElementById('cardNom').innerText = nom;
            document.getElementById('cardPostnom').innerText = postnom;
            document.getElementById('cardPrenom').innerText = prenom;
            document.getElementById('cardMatricule').innerText = matricule;
            document.getElementById('cardProvince').innerText = province;
            document.getElementById('cardAdresse').innerText = adresse;
            document.getElementById('cardUserPhoto').src = tempPhotoBase64;

            renderQRCodeInContainer(document.getElementById('qrcodePreview'), `EDU-RDC:${currentSchoolData.name}:${category}:${matricule}`);
        };

        window.handleUserPhoto = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 150;
                    canvas.height = 180;
                    ctx.drawImage(img, 0, 0, 150, 180);
                    tempPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('cardUserPhoto').src = tempPhotoBase64;
                    window.previewCardUpdate();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.saveCardToFirebase = async function() {
            if (!currentSchoolData) return;

            const btn = document.getElementById('btnSaveCard');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i>Enregistrement Cloud...';

            const cardData = {
                category: document.getElementById('cardCategory').value,
                nom: document.getElementById('inputNom').value || '---',
                postnom: document.getElementById('inputPostnom').value || '---',
                prenom: document.getElementById('inputPrenom').value || '---',
                matricule: document.getElementById('inputMatricule').value || '---',
                province: document.getElementById('inputProvince').value || 'KINSHASA',
                adresse: document.getElementById('inputAdresse').value || '---',
                photo: tempPhotoBase64,
                schoolName: currentSchoolData.name,
                schoolLogo: currentSchoolData.logo || "img/course-1.jpg",
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "cards"), cardData);
                alert("Carte enregistrée avec succès dans Firebase Cloud !");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-cloud-upload-alt me-2"></i>Enregistrer dans Firebase Cloud';
                window.loadSavedCardsVault();
            } catch (err) {
                alert("Erreur Cloud : " + err.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-cloud-upload-alt me-2"></i>Enregistrer dans Firebase Cloud';
            }
        };

        window.loadSavedCardsVault = async function() {
            if (!currentSchoolData) return;
            const container = document.getElementById('vaultCardsContainer');
            container.innerHTML = '<div class="col-12 text-center py-4"><i class="fa fa-spinner fa-spin fa-2x"></i> Chargement des cartes...</div>';

            try {
                const q = query(collection(db, "cards"), where("schoolName", "==", currentSchoolData.name));
                const querySnapshot = await getDocs(q);
                document.getElementById('vaultCount').innerText = querySnapshot.size;

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="col-12 text-center text-muted py-4">Aucune carte enregistrée dans le Cloud pour cette école.</div>`;
                    return;
                }

                container.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const card = docSnap.data();
                    const cardId = docSnap.id;

                    const cardHtml = `
                        <div class="col-md-6 d-flex flex-column align-items-center">
                            <div class="id-card mb-2" style="--school-bg-logo: url('${card.schoolLogo}');">
                                <header>
                                    <div class="header-title">RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</div>
                                    <div class="header-title" style="font-size: 0.32rem; font-weight: normal;">MINISTÈRE DE L'ÉDUCATION NATIONALE</div>
                                    <div class="school-title d-flex justify-content-between align-items-center px-1">
                                        <span>${card.schoolName}</span>
                                        <img src="${card.schoolLogo}" class="school-logo" alt="Logo">
                                    </div>
                                </header>
                                <div class="d-flex align-items-start mt-1">
                                    <img src="${card.photo}" class="card-photo" alt="Photo">
                                    <div class="card-details">
                                        <div><strong class="badge bg-warning text-dark" style="font-size: 0.32rem;">${card.category.toUpperCase()}</strong></div>
                                        <div><strong>Nom :</strong> ${card.nom}</div>
                                        <div><strong>Postnom :</strong> ${card.postnom}</div>
                                        <div><strong>Prénom :</strong> ${card.prenom}</div>
                                        <div><strong>Matricule :</strong> ${card.matricule}</div>
                                        <div><strong>Adresse :</strong> ${card.adresse}</div>
                                        <div><strong>Province :</strong> ${card.province}</div>
                                    </div>
                                </div>
                                <div class="qr-container" id="vault-qr-${cardId}"></div>
                                <div class="footer-assistance">Prière d'assister ce porteur, agent ou élève de l'EDU-RDC, par les autorités civiles et militaires.</div>
                            </div>
                            <button class="btn btn-sm btn-outline-danger" onclick="window.deleteCardCloud('${cardId}')"><i class="fa fa-trash me-1"></i>Supprimer</button>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                });

                querySnapshot.forEach((docSnap) => {
                    const card = docSnap.data();
                    renderQRCodeInContainer(document.getElementById(`vault-qr-${docSnap.id}`), `EDU-RDC:${card.schoolName}:${card.category}:${card.matricule}`);
                });

            } catch (err) {
                container.innerHTML = `<div class="col-12 text-center text-muted py-4">Connexion Cloud en attente.</div>`;
            }
        };

        window.deleteCardCloud = async function(cardId) {
            if (confirm("Supprimer cette carte de Firebase ?")) {
                try {
                    await deleteDoc(doc(db, "cards", cardId));
                    window.loadSavedCardsVault();
                } catch(err) {
                    alert("Erreur de suppression : " + err.message);
                }
            }
        };
    </script>
